<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GC Dashboard - KINGX SCAR PANNEL</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<style>
body{background:#0a0a0a;color:#fff;font-family: 'Segoe UI', sans-serif;}
.card{background:#1a1a1a;border:1px solid #333;border-radius:12px;}
.btn-scar{background:linear-gradient(90deg,#ff0040,#ff8a00);border:0;color:#fff;font-weight:700;}
.header{padding:20px;background:#111;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center;}
.badge-live{background:#00ff88;color:#000;}
.log-box{height:350px;overflow-y:auto;background:#000;border-radius:8px;padding:10px;font-family:monospace;font-size:12px;}
</style>
</head>
<body>
<div class="header">
  <h4>⚡ KINGX SCAR - GC PANNEL</h4>
  <div><a href="/dashboard" class="btn btn-sm btn-outline-light">Main Dashboard</a> <a href="/logout" class="btn btn-sm btn-danger ms-2">Logout</a></div>
</div>
<div class="container mt-4">
  <div class="row">
    <div class="col-md-4">
      <div class="card p-3">
        <h5>Add GC Account</h5>
        <input id="gc_username" class="form-control mb-2 bg-dark text-white border-secondary" placeholder="IG Username">
        <input id="gc_session" class="form-control mb-2 bg-dark text-white border-secondary" placeholder="sessionid (cookie)">
        <input id="gc_thread" class="form-control mb-2 bg-dark text-white border-secondary" placeholder="Thread ID / Group Link">
        <button class="btn btn-scar w-100" onclick="addGC()">Add Account</button>
      </div>
      <div class="card p-3 mt-3">
        <h6>Self Ping Status</h6>
        <div id="pingStatus">Loading...</div>
        <button class="btn btn-sm btn-outline-success mt-2" onclick="pingNow()">Ping Now</button>
      </div>
    </div>
    <div class="col-md-8">
      <div class="card p-3">
        <div class="d-flex justify-content-between mb-3">
          <h5>GC Accounts <span id="accCount" class="badge bg-primary">0</span></h5>
          <div>
            <button class="btn btn-sm btn-success" onclick="startAllGC()">Start All</button>
            <button class="btn btn-sm btn-danger" onclick="stopAllGC()">Stop All</button>
          </div>
        </div>
        <div id="gcList" class="row"></div>
      </div>
      <div class="card p-3 mt-3">
        <h6>Live Logs</h6>
        <div id="logBox" class="log-box"></div>
      </div>
    </div>
  </div>
</div>
<script>
async function loadGC(){
  let r = await fetch('/api/accounts'); let d = await r.json();
  let html=''; let c=0;
  for(let id in d){ c++; let a=d[id];
    html+=`<div class="col-md-6 mb-2"><div class="card p-2"><b>@${a.username||id}</b><br><small>${a.target_name||''}</small><br>
    <span class="badge ${a.running?'bg-success':'bg-secondary'}">${a.running?'RUNNING':'STOPPED'}</span>
    <div class="mt-2"><button class="btn btn-sm btn-success" onclick="startGC('${id}')">Start</button>
    <button class="btn btn-sm btn-danger" onclick="stopGC('${id}')">Stop</button>
    <button class="btn btn-sm btn-outline-danger" onclick="delGC('${id}')">Del</button></div></div></div>`
  }
  document.getElementById('gcList').innerHTML=html; document.getElementById('accCount').innerText=c;
}
async function addGC(){
  let username=document.getElementById('gc_username').value.trim();
  let sessionid=document.getElementById('gc_session').value.trim();
  let thread_id=document.getElementById('gc_thread').value.trim();
  if(!username||!sessionid) return alert('Username & Session required');
  let res=await fetch('/gc_add_account',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,sessionid,thread_id})});
  let data=await res.json(); alert(data.message||'Added'); loadGC();
}
async function startGC(id){ await fetch('/gc_start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid:id})}); loadGC(); }
async function stopGC(id){ await fetch('/gc_stop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid:id})}); loadGC(); }
async function delGC(id){ if(!confirm('Delete?')) return; await fetch('/gc_delete_account',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid:id})}); loadGC(); }
async function startAllGC(){ await fetch('/gc_start_all',{method:'POST'}); loadGC(); }
async function stopAllGC(){ await fetch('/gc_stop_all',{method:'POST'}); loadGC(); }
async function loadPing(){
  try{ let r=await fetch('/api/self_ping/status'); let j=await r.json();
    document.getElementById('pingStatus').innerHTML=`URL: ${j.url||'Not Set'}<br>Interval: ${j.interval}s<br>Last: ${j.last_status}<br><span class="badge ${j.thread_alive?'bg-success':'bg-danger'}">${j.thread_alive?'ALIVE':'DEAD'}</span> ${j.stats?`Total:${j.stats.total_pings} OK:${j.stats.success_pings}`:''}`;
  }catch(e){ document.getElementById('pingStatus').innerText='Error'; }
}
async function pingNow(){ let r=await fetch('/api/self_ping/ping_now',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})}); let j=await r.json(); alert(j.message||j.error); loadPing(); }
async function loadLogs(){ let r=await fetch('/api/accounts/logs'); let d=await r.json(); let box=document.getElementById('logBox'); if(Array.isArray(d)){ box.innerHTML=d.slice(-100).map(l=>`<div>[${l.time||''}] ${l.level||''} ${l.message||''}</div>`).join(''); box.scrollTop=box.scrollHeight; } }
setInterval(()=>{ loadLogs(); loadPing(); },3000);
loadGC(); loadPing(); loadLogs();
</script>
</body>
</html>
